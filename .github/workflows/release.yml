name: Compile Release

on:
  push:
    tags:
      - '*'

  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release from this run
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag to create, for example v0.1.1. Leave blank to use the current firmware version.
        required: false
        default: ""
        type: string

# Needed so the workflow can create a GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Resolve release metadata
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [ -n "${DISPATCH_RELEASE_TAG}" ]; then
            RELEASE_TAG="${DISPATCH_RELEASE_TAG}"
          else
            CURRENT_VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' platformio.ini | head -n 1)"
            if [ -z "${CURRENT_VERSION}" ]; then
              echo "Could not read firmware version from platformio.ini" >&2
              exit 1
            fi
            RELEASE_TAG="v${CURRENT_VERSION}"
          fi

          VERSION="${RELEASE_TAG#v}"   # strip a leading "v" (v1.0.0 -> 1.0.0)
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "FIRMWARE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Set firmware version
        run: |
          set -euo pipefail

          echo "Building Radio Ink ${FIRMWARE_VERSION}"
          sed -i "s/^version = .*/version = ${FIRMWARE_VERSION}/" platformio.ini

      - name: Build Radio Ink (release)
        run: pio run -e gh_release

      - name: Stage release assets
        run: |
          mkdir -p dist
          B=.pio/build/gh_release
          T="${RELEASE_TAG}"
          cp "$B/firmware.bin"   "dist/RadioInk-${T}-firmware.bin"
          cp "$B/bootloader.bin" "dist/RadioInk-${T}-bootloader.bin"
          cp "$B/partitions.bin" "dist/RadioInk-${T}-partitions.bin"
          cp "$B/firmware.elf"   "dist/RadioInk-${T}-firmware.elf"

      - name: Upload release assets
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.create_release }}
        uses: actions/upload-artifact@v6
        with:
          name: RadioInk-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Radio Ink ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: dist/*
          body: |
            Radio Ink ${{ env.RELEASE_TAG }}

            Flash `RadioInk-${{ env.RELEASE_TAG }}-firmware.bin` with the official web
            flasher at https://espterminator.com/ (or via esptool at offset `0x10000`).
            For a fresh full flash, also write `bootloader.bin` (0x0) and
            `partitions.bin` (0x8000).

            ⚠️ Authorized testing only. Transmitting/attack features are compiled out of
            this release build.
